<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATTEND-IT</title>
<style>
:root{
  --navy:#16233f;--navy2:#1d2f54;--maroon:#7a1f3d;--gold:#b8933f;
  --bg:#f3f1ea;--card:#ffffff;--border:#dedad0;--text:#232323;--muted:#6b6b6b;
  --green:#2e7d4f;--red:#b3382c;--yellow:#a67a12;
  --ease:cubic-bezier(.4,0,.2,1);--ease-spring:cubic-bezier(.16,1,.3,1);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;}
h1,h2,h3,.serif{font-family:Georgia,'Times New Roman',serif;}
.shell{display:flex;min-height:100vh;}
.sidebar{width:230px;flex:0 0 230px;background:var(--navy);color:#e7e9f0;padding:26px 0;display:flex;flex-direction:column;transition:width .3s var(--ease),flex-basis .3s var(--ease);}
.brand{padding:0 22px 22px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px;}
.brand h1{margin:0;font-size:22px;letter-spacing:1px;color:#fff;}
.brand p{margin:4px 0 0;font-size:11px;color:#a9b0c4;text-transform:uppercase;letter-spacing:1px;transition:opacity .2s var(--ease);}
.nav a{display:flex;align-items:center;gap:12px;padding:12px 22px;color:#c7cce0;text-decoration:none;font-size:14px;border-left:3px solid transparent;cursor:pointer;transition:background .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease);}
.nav a:hover{background:rgba(255,255,255,.06);}
.nav a.active{background:rgba(255,255,255,.09);border-left-color:var(--gold);color:#fff;font-weight:600;}
.nav a .icon{font-size:16px;width:18px;text-align:center;flex:0 0 auto;}
.nav a .label{transition:opacity .2s var(--ease);}
.sidebar .foot{margin-top:auto;padding:16px 22px 0;font-size:11px;color:#7d84a0;border-top:1px solid rgba(255,255,255,.12);}
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:18px 34px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
.topbar h2{margin:0;font-size:20px;color:var(--navy);}
.topbar p{margin:4px 0 0;color:var(--muted);font-size:13px;}
.topbar-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.clock-badge{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--border);border-radius:22px;padding:8px 18px;flex:0 0 auto;}
.clock-dot{width:9px;height:9px;border-radius:50%;background:var(--green);animation:pulse 1.8s infinite;}
.clock-time{font-family:Georgia,serif;font-size:20px;font-weight:700;color:var(--navy);letter-spacing:.5px;line-height:1;}
.clock-date{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,125,79,.5);}70%{box-shadow:0 0 0 9px rgba(46,125,79,0);}100%{box-shadow:0 0 0 0 rgba(46,125,79,0);}}
.view-switch{display:flex;border:1px solid var(--border);border-radius:20px;overflow:hidden;}
.vs-btn{border:none;background:#fff;padding:8px 12px;font-size:13px;cursor:pointer;color:var(--muted);transition:background .25s var(--ease),color .25s var(--ease);}
.vs-btn.active{background:var(--navy);color:#fff;}
.content{flex:1;padding:28px 34px;overflow-y:auto;animation:fadeIn .4s var(--ease-spring);}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px) scale(.99);}to{opacity:1;transform:translateY(0) scale(1);}}
.card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:22px;margin-bottom:20px;transition:box-shadow .25s var(--ease);}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:22px;}
.stat{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--navy);border-radius:6px;padding:16px 18px;transition:transform .25s var(--ease-spring),box-shadow .25s var(--ease);}
.stat:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(22,35,63,.08);}
.stat .num{font-size:28px;font-weight:700;color:var(--navy);}
.stat .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.stat.green{border-left-color:var(--green);}.stat.green .num{color:var(--green);}
.stat.red{border-left-color:var(--maroon);}.stat.red .num{color:var(--maroon);}
.stat.gold{border-left-color:var(--gold);}.stat.gold .num{color:var(--gold);}
label{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin:16px 0 6px;}
input[type=text]{width:100%;padding:11px 12px;border-radius:4px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:14px;transition:border-color .2s var(--ease);}
input[type=text]:focus{outline:none;border-color:var(--navy);}
.btn{display:inline-block;border:1px solid transparent;border-radius:4px;padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer;transition:filter .2s var(--ease),transform .15s var(--ease);}
.btn:hover{filter:brightness(.94);}
.btn:active{transform:scale(.96);}
.btn-primary{background:var(--navy);color:#fff;}
.btn-outline{background:#fff;color:var(--navy);border-color:var(--navy);}
.btn-danger{background:var(--maroon);color:#fff;}
.btn-block{display:block;width:100%;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:10px 12px;border-bottom:2px solid var(--navy);}
td{padding:10px 12px;border-bottom:1px solid var(--border);}
tr.clickable{cursor:pointer;transition:background .2s var(--ease);}
tr.clickable:hover{background:#f7f6f1;}
.pill{padding:3px 10px;border-radius:3px;font-size:11px;font-weight:700;text-transform:uppercase;}
.pill-present{background:#e4f3e9;color:var(--green);}
.pill-absent{background:#fbe7e4;color:var(--maroon);}
.pill-late{background:#faf1dc;color:var(--yellow);}
.bar{background:#eae7dd;border-radius:3px;height:8px;width:100px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px;}
.bar-fill{background:var(--navy);height:100%;width:0;transition:width 1.1s var(--ease-spring);}
.msg{margin-top:14px;padding:11px 14px;border-radius:4px;font-size:13px;border-left:4px solid;animation:fadeIn .3s var(--ease-spring);}
.msg-ok{background:#e4f3e9;color:var(--green);border-color:var(--green);}
.msg-err{background:#fbe7e4;color:var(--maroon);border-color:var(--maroon);}
.empty{color:var(--muted);text-align:center;padding:40px 0;font-style:italic;}
.row-list{max-height:440px;overflow-y:auto;}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:0 0 12px;border-bottom:1px solid var(--border);padding-bottom:8px;}
::-webkit-scrollbar{width:8px;}::-webkit-scrollbar-thumb{background:#cfcabb;border-radius:4px;}
.bottom-nav{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--navy);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;box-shadow:0 -2px 12px rgba(0,0,0,.1);z-index:10;}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:#aab0c6;font-size:10px;text-decoration:none;cursor:pointer;padding:4px 2px;flex:1;text-align:center;transition:color .2s var(--ease);}
.bottom-nav a .icon{font-size:18px;}
.bottom-nav a.active{color:#fff;}
.nfc-toast{position:fixed;right:20px;bottom:20px;max-width:320px;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--navy);border-radius:8px;padding:14px 16px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:50;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .3s var(--ease-spring),transform .3s var(--ease-spring);}
.nfc-toast.show{opacity:1;transform:translateY(0);pointer-events:auto;}
.nfc-toast.ok{border-left-color:var(--green);}
.nfc-toast.err{border-left-color:var(--maroon);}
[data-view="mobile"] .nfc-toast{bottom:96px;right:14px;left:14px;max-width:none;}

/* --- Responsive modes: auto-detected or manually forced via data-view --- */
[data-view="tablet"] .sidebar{width:78px;flex:0 0 78px;}
[data-view="tablet"] .brand p,[data-view="tablet"] .nav a .label{display:none;opacity:0;}
[data-view="tablet"] .content,[data-view="tablet"] .topbar{padding-left:20px;padding-right:20px;}
[data-view="tablet"] .clock-date{display:none;}

[data-view="mobile"] .sidebar{display:none;}
[data-view="mobile"] .bottom-nav{display:flex;}
[data-view="mobile"] .content{padding-bottom:86px;padding-left:16px;padding-right:16px;}
[data-view="mobile"] .topbar{padding:14px 16px;}
[data-view="mobile"] .clock-date{display:none;}
[data-view="mobile"] .clock-time{font-size:16px;}
[data-view="mobile"] .view-switch .vs-btn:first-child{display:none;}
</style>
</head>
<body>
<div id="app"></div>
<div id="nfcToast" class="nfc-toast" onclick="this.classList.remove('show')"></div>
<script>
let students = [];
try{ students = JSON.parse(localStorage.getItem('attendit_students')||'[]'); }catch(e){ students = []; }
let state = { screen:'dashboard', selectedIndex:-1, prevScreen:'dashboard', searchTerm:'', searchIdx:-2, msg:'', msgErr:false };

function save(){ try{ localStorage.setItem('attendit_students', JSON.stringify(students)); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function today(){ return new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'}); }
function pct(s){ const t=s.present+s.absent+s.late; return t===0?0:(s.present/t*100); }
function go(screen){ state.screen=screen; state.msg=''; state.editingDetail=false; render(); }
function pill(status){ const cls = status==='Present'?'pill-present':status==='Absent'?'pill-absent':'pill-late'; return `<span class="pill ${cls}">${status}</span>`; }
function bar(p){ const w=Math.min(p,100); return `<span class="bar"><span class="bar-fill" data-w="${w}"></span></span>${p.toFixed(1)}%`; }
function animateBars(){
  document.querySelectorAll('.bar-fill[data-w]').forEach(el=>{
    const w=el.dataset.w;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.style.width=w+'%'; }));
  });
}
function animateStats(){
  document.querySelectorAll('.stat .num[data-target]').forEach(el=>{
    const target=parseFloat(el.dataset.target)||0;
    const suffix=el.dataset.suffix||'';
    const decimals=el.dataset.target.includes('.')?1:0;
    const start=performance.now(), dur=700;
    function step(t){
      const p=Math.min((t-start)/dur,1);
      const eased=1-Math.pow(1-p,3);
      el.textContent=(target*eased).toFixed(decimals)+suffix;
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}
function tickClock(){ const el=document.getElementById('liveClockTop'); if(el) el.textContent=new Date().toLocaleTimeString('en-US'); }
setInterval(tickClock,1000);

let toastTimer=null;
function showToast(msg,type){
  const t=document.getElementById('nfcToast');
  if(!t) return;
  t.textContent=msg;
  t.className='nfc-toast show '+(type||'');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),5000);
}
async function globalScanNFC(){
  if(!('NDEFReader' in window)){
    showToast('NFC isn\u2019t supported on this browser/device. Try Chrome on an NFC-enabled Android device.','err');
    return;
  }
  try{
    showToast('Ready \u2014 tap the tag against the device now\u2026');
    const reader = new NDEFReader();
    await reader.scan();
    let gotReading=false;
    reader.onreading = (event) => {
      gotReading=true;
      const id = event.serialNumber || 'TAG-'+Date.now();
      handleScannedTag(id);
    };
    reader.onreadingerror = () => showToast('A tag was sensed but couldn\u2019t be read \u2014 it may not be a compatible (NDEF) tag.','err');
    setTimeout(()=>{ if(!gotReading) showToast('No readable tag detected within 12s. If you did tap one, it may not be NFC-compatible with this browser.','err'); },12000);
  }catch(e){
    showToast('NFC permission denied, or scanning isn\u2019t available right now.','err');
  }
}
function handleScannedTag(id){
  const idx = students.findIndex(s=>s.id===id);
  if(idx>=0){
    state.selectedIndex = idx;
    showToast('Tag recognized: '+students[idx].name+'. Choose a status to record.','ok');
    go('recordStatus');
  } else {
    const n = students.length+1;
    students.push({id, name:'Student '+n, section:'Block A', present:0, absent:0, late:0, attendance:[]});
    save();
    state.selectedIndex = students.length-1;
    state.prevScreen = 'dashboard';
    go('detail');
    state.editingDetail = true;
    showToast('New tag registered as \u201cStudent '+n+'.\u201d Edit the name and section below if you\u2019d like.','ok');
    render();
  }
}

function effectiveView(){
  const m=localStorage.getItem('attendit_viewmode')||'auto';
  if(m!=='auto') return m;
  const w=window.innerWidth;
  return w<=680?'mobile':w<=1024?'tablet':'desktop';
}
function applyViewMode(){ document.documentElement.setAttribute('data-view', effectiveView()); }
function setViewMode(m){ try{ localStorage.setItem('attendit_viewmode', m); }catch(e){} applyViewMode(); render(); }
window.addEventListener('resize', ()=>{ if((localStorage.getItem('attendit_viewmode')||'auto')==='auto') applyViewMode(); });

function msgBox(){ if(!state.msg) return ''; return `<div class="msg ${state.msgErr?'msg-err':'msg-ok'}">${esc(state.msg)}</div>`; }
function avgRate(){ if(!students.length) return 0; return students.reduce((a,s)=>a+pct(s),0)/students.length; }
function todayCount(status){ const d=today(); return students.reduce((a,s)=>a+s.attendance.filter(r=>r.date===d&&r.status===status).length,0); }

const NAV=[['dashboard','\u25A3','Dashboard'],['register','\u002B','Register Student'],['list','\u2630','Student List'],
  ['recordSelect','\u2713','Record Attendance'],['search','\u26B2','Search Student'],['report','\u2637','Attendance Report'],['clear','\u2716','Clear Data']];

const SCREEN_TITLES={dashboard:['Dashboard','Overview of registered students and attendance'],
  register:['Register Student','Add a new student to the roster'],list:['Student List','All currently registered students'],
  recordSelect:['Record Attendance','Select a student to log today\u2019s attendance'],
  recordStatus:['Record Attendance','Mark today\u2019s status'],search:['Search Student','Look up an individual record'],
  report:['Attendance Report','Consolidated summary for all students'],detail:['Student Record','Full attendance history'],
  clear:['Clear Data','Permanently remove all records']};

function isActive(key){
  if(state.screen===key) return true;
  if(key==='recordSelect' && state.screen==='recordStatus') return true;
  if(key==='report' && state.screen==='detail' && state.prevScreen==='report') return true;
  if(key==='dashboard' && state.screen==='detail' && state.prevScreen==='dashboard') return true;
  return false;
}

function sidebar(){
  return `<aside class="sidebar"><div class="brand"><h1 class="serif">ATTEND-IT</h1><p>Attendance Management System</p></div>
    <nav class="nav">${NAV.map(n=>`<a class="${isActive(n[0])?'active':''}" onclick="go('${n[0]}')"><span class="icon">${n[1]}</span><span class="label">${n[2]}</span></a>`).join('')}</nav>
    <div class="foot">Local session \u2014 v1.1</div></aside>`;
}
function bottomNav(){
  return `<nav class="bottom-nav">${NAV.map(n=>`<a class="${isActive(n[0])?'active':''}" onclick="go('${n[0]}')"><span class="icon">${n[1]}</span><span>${n[2].split(' ')[0]}</span></a>`).join('')}</nav>`;
}
function viewSwitcher(){
  const cur=localStorage.getItem('attendit_viewmode')||'auto';
  const opts=[['auto','Auto'],['desktop','\u{1F5A5}'],['tablet','\u25AD'],['mobile','\u{1F4F1}']];
  return `<div class="view-switch">${opts.map(o=>`<button class="vs-btn ${cur===o[0]?'active':''}" onclick="setViewMode('${o[0]}')" title="${o[0]}">${o[1]}</button>`).join('')}</div>`;
}
function topbar(){
  const t=SCREEN_TITLES[state.screen]||['',''];
  return `<div class="topbar"><div><h2>${t[0]}</h2><p>${t[1]}</p></div>
    <div class="topbar-right">
      <button class="btn btn-outline" onclick="globalScanNFC()" title="Scan an NFC tag from anywhere">\u{1F4E1} Scan NFC</button>
      <div class="clock-badge"><span class="clock-dot"></span><div><div class="clock-time" id="liveClockTop"></div><div class="clock-date">${today()}</div></div></div>
      ${viewSwitcher()}
    </div></div>`;
}
function backBtn(target){ return `<button class="btn btn-outline" onclick="go('${target}')" style="margin-top:18px">&lt; Back</button>`; }

function renderDashboard(){
  return `<div class="grid">
    <div class="stat"><div class="num" data-target="${students.length}">0</div><div class="lbl">Total Students</div></div>
    <div class="stat green"><div class="num" data-target="${todayCount('Present')}">0</div><div class="lbl">Present Today</div></div>
    <div class="stat red"><div class="num" data-target="${todayCount('Absent')}">0</div><div class="lbl">Absent Today</div></div>
    <div class="stat gold"><div class="num" data-target="${avgRate().toFixed(1)}" data-suffix="%">0%</div><div class="lbl">Average Attendance Rate</div></div>
  </div>
  <div class="card">
    <div class="section-title">Roster Summary</div>
    ${students.length? `<table><tr><th>Student No.</th><th>Name</th><th>Section</th><th>Attendance Rate</th></tr>${
      students.map((s,i)=>`<tr class="clickable" onclick="viewDetail(${i},'dashboard')"><td>${esc(s.id)}</td><td>${esc(s.name)}</td><td>${esc(s.section)}</td><td>${bar(pct(s))}</td></tr>`).join('')}
      </table>` : `<div class="empty">No students registered yet. Use "Register Student" to begin.</div>`}
  </div>`;
}

function renderRegister(){
  return `<div class="card" style="max-width:480px">
    <label>Student Number</label>
    <div style="display:flex;gap:8px">
      <input type="text" id="regId" placeholder="e.g. 21-0001" style="flex:1">
      <button class="btn btn-outline" onclick="scanNFC()" title="Scan NFC tag">\u{1F4E1} Scan</button>
    </div>
    <div id="nfcStatus" style="font-size:12px;color:var(--muted);margin-top:6px"></div>
    <label>Student Name</label><input type="text" id="regName" placeholder="Full name">
    <label>Section</label><input type="text" id="regSection" placeholder="e.g. ME-2A">
    <button class="btn btn-primary btn-block" style="margin-top:20px" onclick="doRegister()">Register Student</button>
    ${msgBox()}</div>`;
}
async function scanNFC(){
  const status=document.getElementById('nfcStatus');
  if(!('NDEFReader' in window)){
    status.style.color='var(--maroon)';
    status.textContent='NFC scanning isn\u2019t supported on this browser/device (works on Chrome for Android with NFC hardware). Enter the number manually instead.';
    return;
  }
  try{
    status.style.color='var(--muted)';
    status.textContent='Ready \u2014 tap an NFC tag against the device now\u2026';
    const reader = new NDEFReader();
    await reader.scan();
    reader.onreading = (event) => {
      const id = event.serialNumber || 'TAG-' + Date.now();
      const field = document.getElementById('regId');
      if(field) field.value = id;
      const s = document.getElementById('nfcStatus');
      if(s){ s.style.color='var(--green)'; s.textContent = 'Tag scanned \u2014 Student Number filled with tag ID ('+id+'). Edit if needed, then register.'; }
    };
    reader.onreadingerror = () => {
      const s = document.getElementById('nfcStatus');
      if(s){ s.style.color='var(--maroon)'; s.textContent='Could not read that tag. Try again or enter manually.'; }
    };
  }catch(e){
    status.style.color='var(--maroon)';
    status.textContent='NFC permission was denied, or scanning isn\u2019t available right now. You can still enter the number manually.';
  }
}
function doRegister(){
  const id=document.getElementById('regId').value.trim();
  const name=document.getElementById('regName').value.trim();
  const section=document.getElementById('regSection').value.trim();
  if(!id||!name||!section){ state.msg='All fields are required.'; state.msgErr=true; render(); return; }
  if(students.some(s=>s.id===id)){ state.msg='That student number already exists.'; state.msgErr=true; render(); return; }
  students.push({id,name,section,present:0,absent:0,late:0,attendance:[]});
  save();
  state.msg='Student registered successfully.'; state.msgErr=false;
  render();
}

function renderList(){
  let body = students.length? `<div class="row-list"><table><tr><th>Student No.</th><th>Name</th><th>Section</th></tr>${
    students.map(s=>`<tr><td>${esc(s.id)}</td><td>${esc(s.name)}</td><td>${esc(s.section)}</td></tr>`).join('')}</table></div>`
    : `<div class="empty">No students registered yet.</div>`;
  return `<div class="card">${body}</div>`;
}

function renderRecordSelect(){
  let body = students.length? `<div class="row-list"><table><tr><th>Student No.</th><th>Name</th><th>Section</th></tr>${
    students.map((s,i)=>`<tr class="clickable" onclick="selectForRecord(${i})"><td>${esc(s.id)}</td><td>${esc(s.name)}</td><td>${esc(s.section)}</td></tr>`).join('')}</table></div>`
    : `<div class="empty">No students registered yet.</div>`;
  return `<div class="card">${body}</div>`;
}
function selectForRecord(i){ state.selectedIndex=i; go('recordStatus'); }

function renderRecordStatus(){
  const s=students[state.selectedIndex];
  if(!s) return renderRecordSelect();
  return `<div class="card" style="max-width:520px">
    <div class="section-title">Student</div>
    <p><b>${esc(s.name)}</b> &nbsp;\u2022&nbsp; ${esc(s.id)} &nbsp;\u2022&nbsp; ${esc(s.section)}</p>
    <div class="section-title" style="margin-top:20px">Mark Attendance \u2014 ${today()}</div>
    <button class="btn btn-primary" style="width:32%;margin-right:2%;background:var(--green)" onclick="mark('Present')">Present</button>
    <button class="btn btn-primary" style="width:32%;margin-right:2%;background:var(--maroon)" onclick="mark('Absent')">Absent</button>
    <button class="btn btn-primary" style="width:32%;background:var(--gold)" onclick="mark('Late')">Late</button>
    ${msgBox()}${backBtn('recordSelect')}</div>`;
}
function mark(status){
  const s=students[state.selectedIndex];
  if(status==='Present') s.present++; else if(status==='Absent') s.absent++; else s.late++;
  s.attendance.push({date:today(),status});
  save();
  go('dashboard'); state.msg='Attendance recorded as '+status+' for '+s.name+'.'; state.msgErr=false; render();
}

function studentDetailHtml(s, idx){
  let hist = s.attendance.length? `<table><tr><th>Day / Date</th><th>Status</th></tr>${
    s.attendance.slice().reverse().map(a=>`<tr><td>${esc(a.date)}</td><td>${pill(a.status)}</td></tr>`).join('')}</table>`
    : `<div class="empty">No attendance records yet.</div>`;
  const header = state.editingDetail
    ? `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
         <input type="text" id="editName" value="${esc(s.name)}" placeholder="Name" style="flex:1;min-width:140px">
         <input type="text" id="editSection" value="${esc(s.section)}" placeholder="Section" style="flex:1;min-width:120px">
         <button class="btn btn-primary" onclick="saveEditDetail(${idx})">Save</button>
         <button class="btn btn-outline" onclick="cancelEditDetail()">Cancel</button>
       </div>`
    : `<p><b>${esc(s.name)}</b> &nbsp;\u2022&nbsp; ${esc(s.id)} &nbsp;\u2022&nbsp; ${esc(s.section)}
         <button class="btn btn-outline" style="padding:4px 10px;font-size:12px;margin-left:10px" onclick="startEditDetail()">Edit</button></p>`;
  return `<div class="card">
    <div class="section-title">Student Information</div>
    ${header}
    <div class="grid" style="margin-top:14px">
      <div class="stat green"><div class="num">${s.present}</div><div class="lbl">Present</div></div>
      <div class="stat red"><div class="num">${s.absent}</div><div class="lbl">Absent</div></div>
      <div class="stat gold"><div class="num">${s.late}</div><div class="lbl">Late</div></div>
      <div class="stat"><div class="num">${pct(s).toFixed(1)}%</div><div class="lbl">Attendance Rate</div></div>
    </div></div>
    <div class="card"><div class="section-title">Attendance History</div>
    <div class="row-list">${hist}</div></div>`;
}
function startEditDetail(){ state.editingDetail=true; render(); }
function cancelEditDetail(){ state.editingDetail=false; render(); }
function saveEditDetail(idx){
  const name=document.getElementById('editName').value.trim();
  const section=document.getElementById('editSection').value.trim();
  if(name) students[idx].name=name;
  if(section) students[idx].section=section;
  state.editingDetail=false;
  save();
  render();
}

function renderSearch(){
  let result='';
  if(state.searchIdx===-2 && state.searchTerm) result=`<div class="card"><div class="empty">No student found with that name.</div></div>`;
  else if(state.searchIdx>=0) result=studentDetailHtml(students[state.searchIdx], state.searchIdx);
  else result=`<div class="card"><div class="empty">Type a name above and press Search.</div></div>`;
  return `<div class="card" style="max-width:600px">
    <input type="text" id="searchBox" placeholder="Enter student name..." value="${esc(state.searchTerm)}" onkeydown="if(event.key==='Enter')doSearch()">
    <button class="btn btn-primary" style="margin-top:12px" onclick="doSearch()">Search</button></div>
    ${result}`;
}
function doSearch(){
  const term=document.getElementById('searchBox').value.trim();
  state.searchTerm=term;
  state.searchIdx = students.findIndex(s=>s.name===term);
  render();
}

function renderReport(){
  let body = students.length? `<table><tr><th>Student No.</th><th>Name</th><th>Present</th><th>Absent</th><th>Late</th><th>Attendance Rate</th></tr>${
    students.map((s,i)=>`<tr class="clickable" onclick="viewDetail(${i},'report')"><td>${esc(s.id)}</td><td>${esc(s.name)}</td>
    <td>${s.present}</td><td>${s.absent}</td><td>${s.late}</td><td>${bar(pct(s))}</td></tr>`).join('')}</table>`
    : `<div class="empty">No students registered yet.</div>`;
  return `<div class="card">${body}${students.length?'<p style="color:var(--muted);font-size:12px;margin-top:10px">Click a row for full history.</p>':''}</div>`;
}
function viewDetail(i,prev){ state.selectedIndex=i; state.prevScreen=prev; go('detail'); }

function renderDetail(){
  const s=students[state.selectedIndex];
  if(!s) return renderReport();
  return studentDetailHtml(s, state.selectedIndex)+backBtn(state.prevScreen);
}

function renderClear(){
  return `<div class="card" style="max-width:480px">
    <p>This will permanently delete <b>all</b> student and attendance records. This action cannot be undone.</p>
    <button class="btn btn-danger" style="width:48%;margin-right:4%" onclick="doClear()">Yes, Clear All Data</button>
    <button class="btn btn-outline" style="width:48%" onclick="go('dashboard')">Cancel</button></div>`;
}
function doClear(){ students=[]; save(); go('dashboard'); state.msg='All data cleared.'; state.msgErr=false; render(); }

function render(){
  const map={dashboard:renderDashboard,register:renderRegister,list:renderList,recordSelect:renderRecordSelect,
    recordStatus:renderRecordStatus,search:renderSearch,report:renderReport,detail:renderDetail,clear:renderClear};
  document.getElementById('app').innerHTML = `<div class="shell">${sidebar()}<div class="main">${topbar()}<div class="content">${map[state.screen]()}</div></div></div>${bottomNav()}`;
  tickClock();
  animateBars();
  if(state.screen==='dashboard') animateStats();
}
applyViewMode();
render();
</script>
</body>
</html>
